# Relais vidéo supplémentaire (Jitsi Videobridge). Un par serveur ; Jicofo répartit
# automatiquement les classes entre tous les relais connectés au serveur principal.
# Usage : cp jvb-node.env.example .env, remplissez-le, puis docker compose up -d
services:
  jvb:
    image: ghcr.io/jitsi/jvb:${JITSI_IMAGE_VERSION:-stable-11248-3}
    restart: unless-stopped
    ports:
      # Vidéo et canal de données (SCTP) en direct avec les participants.
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
      # Statistiques du relais, consultables depuis ce serveur seulement.
      - "127.0.0.1:8080:8080"
    environment:
      - XMPP_SERVER
      - XMPP_PORT
      - XMPP_AUTH_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - JVB_AUTH_USER
      - JVB_AUTH_PASSWORD
      - JVB_BREWERY_MUC
      - JVB_PORT
      - JVB_ADVERTISE_IPS
      - TZ

# Ajouté au docker-compose officiel quand XMPP_PRIVATE_IP est défini dans main.env :
# les relais vidéo supplémentaires rejoignent Prosody (XMPP) et exposent leurs WebSockets
# uniquement sur le réseau privé. Ne publiez jamais 5222 sur l'IP publique.
services:
  prosody:
    ports:
      - "${XMPP_PRIVATE_IP}:5222:5222"

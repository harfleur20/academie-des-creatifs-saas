services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/backend/academie_saas_fresh_20261005.db
      FRONTEND_URL: http://localhost:3101
      BACKEND_PUBLIC_URL: http://localhost:8000
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/alembic:/app/backend/alembic
      - ./backend/main.py:/app/backend/main.py
      - ./backend/alembic.ini:/app/backend/alembic.ini
      - ./backend/academie_saas_fresh_20261005.db:/app/backend/academie_saas_fresh_20261005.db
      - ./backend/uploads:/app/backend/uploads
      - ./backend/private_uploads:/app/backend/private_uploads
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_DEV_API_PROXY_TARGET: http://backend:8000
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 3101 --strictPort
    ports:
      - "3101:3101"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:

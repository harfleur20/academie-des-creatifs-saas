name: SaaS CI

on:
  push:
    branches:
      - main
      - "lot-*"
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall app
      - name: Run backend tests
        run: python -m pytest -q
      - name: Test SQLite migrations from scratch
        run: |
          rm -f ci_migrations.db
          DATABASE_URL=sqlite:///./ci_migrations.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci_migrations.db alembic current
      - name: Test recovery from partially applied Tara migration
        run: |
          rm -f ci_partial_migration.db
          DATABASE_URL=sqlite:///./ci_partial_migration.db alembic upgrade 20261001_0004
          python - <<'PY'
          import sqlite3

          db = sqlite3.connect("ci_partial_migration.db")
          db.execute("ALTER TABLE billing_payment_attempts ADD COLUMN checkout_url TEXT")
          db.execute(
              "ALTER TABLE billing_payment_attempts "
              "ADD COLUMN provider_transaction_id VARCHAR(180)"
          )
          db.execute(
              "ALTER TABLE billing_payment_attempts "
              "ADD COLUMN activated_subscription_id INTEGER"
          )
          db.commit()
          db.close()
          PY
          DATABASE_URL=sqlite:///./ci_partial_migration.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci_partial_migration.db alembic current

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academie
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: academie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academie -d academie_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://academie:test-password@localhost:5432/academie_test
      TEST_POSTGRES_URL: postgresql+psycopg://academie:test-password@localhost:5432/academie_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Test PostgreSQL migrations
        run: alembic upgrade head
      - name: Test concurrent checkout, payment and delivery
        run: python -m pytest tests/test_postgres_concurrency.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and build frontend
        run: npm run build
